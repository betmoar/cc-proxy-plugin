name: release

# Cutting a release (see CLAUDE.md): merge to main with package.json bumped via
# `pnpm version <patch|minor> --no-git-tag-version` (which runs sync-version.mjs
# so plugin.json moves in step; the flag is required off main — scripts/version-
# guard.js refuses a tagging invocation there, issue #41) and the matching
# `## [x.y.z]` entry newest in CHANGELOG.md, then push a tag `v<x.y.z>` CREATED
# ON MAIN after the squash. This workflow fails the tag build on any mismatch, re-runs
# the full gate (lint + tests), and publishes a GitHub release whose body is
# that version's CHANGELOG section.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Backstop for every way a tag can be created off main that the local
      # guard cannot see — `git tag` by hand, `pnpm version --ignore-scripts`
      # (neither lifecycle script runs), a repeated flag resolved last-wins.
      # A release pointing at a commit the squash-merge discarded is the #41
      # failure, and this is the one place every path converges.
      - name: Gate — the tag's commit is on main (issue #41 backstop)
        run: |
          git fetch --no-tags origin main
          commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $commit, which is not on main — the tag was created on a branch before the squash (issue #41). Delete it and re-tag on main."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Gate — tag == plugin.json == package.json == newest CHANGELOG heading
        run: node scripts/release-gate.mjs "$GITHUB_REF_NAME" --notes-out release-notes.md

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
