name: release

# Cutting a release (see CLAUDE.md): merge to main with package.json bumped via
# `pnpm version <patch|minor> --no-git-tag-version` (which runs sync-version.mjs
# so plugin.json moves in step; the flag is required off main — scripts/version-
# guard.js refuses a tagging invocation there, issue #41) and the matching
# `## [x.y.z]` entry newest in CHANGELOG.md, then push a tag `v<x.y.z>` CREATED
# ON MAIN after the squash. This workflow fails the tag build on any mismatch, re-runs
# the full gate (lint + tests), and publishes a GitHub release whose body is
# that version's CHANGELOG section.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Gate — tag == plugin.json == package.json == newest CHANGELOG heading
        run: node scripts/release-gate.mjs "$GITHUB_REF_NAME" --notes-out release-notes.md

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
